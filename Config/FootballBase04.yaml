# PoFootball — milestone 3: six brains, real per-role dynamics, live fatigue,
# a passing game with non-negative expected value, and per-agent credit.
#
# Pairs 1:1 with run-id `football_base04` (UNITY_RULES §1).
#   mlagents-learn Config/FootballBase04.yaml --run-id=football_base04
#
# ---------------------------------------------------------------------------
# WHY NOTHING TRANSFERS FROM football_base03
# ---------------------------------------------------------------------------
# The behavior set, the action space and the dynamics all changed. No earlier
# .onnx will load and --initialize-from is not an option; this starts from
# scratch.
#
#   behaviors     4 -> 6      quarterback split out of OffenseSkill; DefenseCover
#                             split into DefenseBox (linebackers) and
#                             DefenseSecondary (corners and safeties)
#   Quarterback   4 continuous + discrete [5, 2]   (branch was [4, 2])
#   every other   2 continuous, unchanged in shape but NOT in meaning — the
#                 bodies they drive have different mass and force
#   observations  32, unchanged
#
# ---------------------------------------------------------------------------
# WHAT CHANGED IN THE SIMULATION
# ---------------------------------------------------------------------------
# 1. Bodies are per role. Mass is a real playing weight (92-140 kg) and drive
#    force is DERIVED as v * m * d so terminal velocity equals the role's top
#    speed exactly. Through base03 every player massed 100 kg and pushed 900 N,
#    which pins terminal velocity at 6.0 m/s for EVERYONE — the 9.0 / 7.5 / 6.5
#    top speeds were unreachable and existed only as an observation normalizer.
#    A receiver and a guard were the same body.
#
# 2. Fatigue accumulates. The old constants put the break-even load at 5000
#    against a maximum producible load of 1200, so `_fatigue` was pinned at zero
#    for every player in every play of base01 through base03. Load is now
#    dimensionless, normalized per role, and still read from APPLIED force.
#
# 3. Play-call branch index 0 means "no call". It used to be four wide with the
#    agent adding one, so a zeroed action buffer — what ML-Agents hands back
#    between EndEpisode and the next decision — decoded to a deliberate
#    KeepQuarterback.
#
# 4. Completing a pass pays. COMPLETION_REWARD was declared and read by nothing
#    while INCOMPLETION_PENALTY was live and larger, so every pass outcome the
#    reward could see was a bad one and Call/Pass sat at 0.000 for 2.4M steps.
#
# 5. Per-agent credit: linemen earn a small per-tick term for shielding the ball,
#    receivers for separation, defenders for closing. Every other term on the
#    sheet is identical for all eleven team-mates.
#
# ---------------------------------------------------------------------------
# WHAT TO LOOK AT
# ---------------------------------------------------------------------------
#   Call/Entropy            THE number to watch, in nats, max ln(5) = 1.61. This
#                           is the metric base03 lacked: Policy/Entropy sums
#                           across every action head at once and sat at a
#                           healthy 3.5 while the play call had collapsed onto
#                           one option 93% of the time.
#   Call/None               plays where the QB never committed. Should be ~0
#                           after the first few thousand steps; a persistent
#                           non-zero value means the latch is not being reached.
#   Pass/AttemptRate        how often a pass is called at all.
#   Pass/CompletionPerAttempt  conditioned on attempts, so it is readable even
#                           when attempts are rare. Play/CompletionRate used to
#                           be written on every play and was uninterpretable.
#   Pass/InterceptionPerAttempt  if this runs away the offense is throwing into
#                           coverage and the pass rewards need rebalancing.
#   Play/TimeExpiredRate    acceptance criterion #23 — target < 0.20.
#   Play/NetYards           single digits. Tens of yards means the defense has
#                           stopped being able to stop anything.
#
# Judge on ELO and the Play/*, Pass/* and Call/* series, not mean reward —
# reward is zero-sum here and hovers near 0 however good the policies get
# (UNITY_RULES §4).

default_settings: null

behaviors:
  OffenseLine: &football_brain
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480          # 10x batch_size; PPO wants many batches per update
      learning_rate: 3.0e-4
      beta: 5.0e-3                # entropy bonus — keep exploration alive through self-play
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant   # self-play runs long; a linear decay to 0
                                         # freezes the policy while opponents keep improving
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState already emits [-1, 1]; running
                                  # normalization on top fights self-play because the
                                  # input distribution shifts with the opponent.
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 10          # was 40. Tools/prune_results.py exists because
                                  # base01-03 left 926 MB and 104 .onnx behind.
    checkpoint_interval: 500000
    max_steps: 50000000

    # A play is capped at 750 physics ticks and agents decide every 5th tick
    # (Systems_PlayModel.MAX_DECISIONS = 150), so 150 keeps an entire play inside
    # one horizon and lets credit for a touchdown reach back to the snap — and,
    # now, back to the play call that set it up.
    time_horizon: 150

    summary_freq: 20000
    threaded: false               # deterministic ordering (UNITY_RULES §2)

    self_play:
      save_steps: 50000
      team_change: 250000         # 5x save_steps — the documented default ratio
      swap_steps: 25000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

  OffenseSkill:
    <<: *football_brain

  # The only brain with discrete actions, and the only one whose exploration
  # problem is a DISCRETE one: five play calls of which four were never sampled
  # by the end of base03.
  #
  # It gets four times the entropy bonus of the movement brains. That is safe
  # here in a way it was not when this policy also drove four backs and
  # receivers — beta applies to the whole action distribution, so raising it on
  # the shared brain would have injected noise into five players' steering in
  # order to keep one player's play call exploring. Splitting the brain is what
  # makes this knob usable at all.
  Quarterback:
    <<: *football_brain
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 2.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseLine:
    <<: *football_brain

  DefenseBox:
    <<: *football_brain

  DefenseSecondary:
    <<: *football_brain

env_settings:
  # Set per-run on the command line, not here:
  #   --env=Builds/FootballEnv/PoFootball.exe --no-graphics --base-port=5010 --num-envs=4
  # Envs take CONSECUTIVE ports from --base-port; overlapping ranges hang the
  # handshake with no error (UNITY_RULES §4).
  #
  # Record --num-envs in the run's MANIFEST.md — it changes how experience is
  # batched, so two runs with this file and different --num-envs are not
  # comparable. Tools/promote_brain.py writes it into the manifest for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cuda                    # RTX 2060 present; falls back to cpu if unavailable

checkpoint_settings:
  results_dir: results
