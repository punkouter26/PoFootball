# PoFootball — milestone 3b: the same six brains as football_base04, with
# self-play removed.
#
# Pairs 1:1 with run-id `football_base05` (UNITY_RULES §1).
#   mlagents-learn Config/FootballBase05.yaml --run-id=football_base05
#
# ---------------------------------------------------------------------------
# WHY SELF-PLAY IS GONE, AND WHY THAT IS NOT A REGRESSION
# ---------------------------------------------------------------------------
# football_base04 stalled. Three of its six brains — DefenseLine, DefenseBox
# and DefenseSecondary — stopped receiving experience 29 minutes into the run
# and never resumed, while OffenseLine and OffenseSkill carried on for another
# 74 minutes and 700k steps against an opponent that had stopped learning.
#
# The cause is in the run log, one line per brain at startup:
#
#   [INFO] Connected new brain: OffenseLine?team=0
#   [INFO] Connected new brain: DefenseLine?team=1
#
# Every behavior here carries exactly ONE team id, because the behavior name
# comes from the brain group (Systems_RoleTable.BehaviorNameOf) and the team id
# from the side — so an offense behavior is only ever team 0 and a defense
# behavior only ever team 1.
#
# ML-Agents self-play does not model two different behaviors playing each
# other. It models ONE behavior playing itself: a learning team and a frozen
# ghost team, both under the same behavior name, swapped every `team_change`
# steps. Given a behavior that contains only one team, the ghost trainer has a
# learning team and no opponent to swap in. At team_change (250k steps) the
# defense behaviors swapped out and there was nothing to swap back.
# DefenseLine and DefenseSecondary froze at exactly 320k, DefenseBox at 240k.
#
# So self-play was never actually running in base01-base04. It was a ghost
# trainer with no ghost. Removing it does not remove a capability the project
# had; it removes the thing that was silently killing half the brains.
#
# WHAT TO JUDGE THIS RUN ON. UNITY_RULES §4 says judge self-play on ELO rather
# than mean reward, because reward is zero-sum and cancels. That reasoning
# applies to one behavior playing itself. Here offense and defense are separate
# behaviors with separate reward streams, so ELO no longer exists and mean
# reward per behavior IS the signal — they should move in opposition. In
# base04 the split was already legible: defense +0.65, offense -0.37.
#
# Watch, in order of usefulness:
#   Environment/Cumulative Reward   per behavior, offense vs defense
#   Call/Entropy                    from Agent_Telemetry — the play call alone.
#                                   The trainer's own Policy/Entropy sums every
#                                   action head and hid a collapsed play call at
#                                   a healthy-looking 3.5 through base03.
#   Play/*, Pass/*                  outcome and passing rates
#
# If self-play is genuinely wanted later it needs a behavior that plays both
# sides — i.e. one brain name shared across offense and defense with the field
# mirrored — which is a design change to Systems_RoleTable, not a config knob.
#
# Everything else below is byte-identical to FootballBase04.yaml.
# ---------------------------------------------------------------------------

default_settings: null

behaviors:
  OffenseLine: &football_brain
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480          # 10x batch_size; PPO wants many batches per update
      learning_rate: 3.0e-4
      beta: 5.0e-3                # entropy bonus — keep exploration alive through self-play
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant   # self-play runs long; a linear decay to 0
                                         # freezes the policy while opponents keep improving
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState already emits [-1, 1]; running
                                  # normalization on top fights self-play because the
                                  # input distribution shifts with the opponent.
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 10          # was 40. Tools/prune_results.py exists because
                                  # base01-03 left 926 MB and 104 .onnx behind.
    checkpoint_interval: 500000
    max_steps: 50000000

    # A play is capped at 750 physics ticks and agents decide every 5th tick
    # (Systems_PlayModel.MAX_DECISIONS = 150), so 150 keeps an entire play inside
    # one horizon and lets credit for a touchdown reach back to the snap — and,
    # now, back to the play call that set it up.
    time_horizon: 150

    summary_freq: 20000
    threaded: false               # deterministic ordering (UNITY_RULES §2)

  OffenseSkill:
    <<: *football_brain

  # The only brain with discrete actions, and the only one whose exploration
  # problem is a DISCRETE one: five play calls of which four were never sampled
  # by the end of base03.
  #
  # It gets four times the entropy bonus of the movement brains. That is safe
  # here in a way it was not when this policy also drove four backs and
  # receivers — beta applies to the whole action distribution, so raising it on
  # the shared brain would have injected noise into five players' steering in
  # order to keep one player's play call exploring. Splitting the brain is what
  # makes this knob usable at all.
  Quarterback:
    <<: *football_brain
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 2.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseLine:
    <<: *football_brain

  DefenseBox:
    <<: *football_brain

  DefenseSecondary:
    <<: *football_brain

env_settings:
  # Set per-run on the command line, not here:
  #   --env=Builds/FootballEnv/PoFootball.exe --no-graphics --base-port=5010 --num-envs=4
  # Envs take CONSECUTIVE ports from --base-port; overlapping ranges hang the
  # handshake with no error (UNITY_RULES §4).
  #
  # Record --num-envs in the run's MANIFEST.md — it changes how experience is
  # batched, so two runs with this file and different --num-envs are not
  # comparable. Tools/promote_brain.py writes it into the manifest for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cuda                    # RTX 2060 present; falls back to cpu if unavailable

checkpoint_settings:
  results_dir: results
