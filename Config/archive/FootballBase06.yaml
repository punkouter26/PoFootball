# PoFootball — milestone 3c: the same six brains as football_base05, with the
# reward imbalance that collapsed it corrected.
#
# Pairs 1:1 with run-id `football_base06` (UNITY_RULES §1).
#   mlagents-learn Config/FootballBase06.yaml --run-id=football_base06
#
# Self-play stays removed. See FootballBase05.yaml for why — every behavior here
# carries exactly one team id, so the ghost trainer had no opponent to swap in
# and it silently froze three of six brains 29 minutes into base04.
#
# ---------------------------------------------------------------------------
# WHY football_base05 COLLAPSED
# ---------------------------------------------------------------------------
# It ran clean for nine hours and 7.66M steps with no errors and no restarts,
# and the policy still degenerated:
#
#     step     Call/Entropy  Halfback  Pass   TD-rate  NetYards
#      760,000     1.373       0.27    0.16    0.00      -1.5
#    2,060,000     1.105       0.635   0.00    0.25      22.2
#    3,080,000     0.405       1.000   0.00    0.816     52.5
#    7,500,000     0.100       0.990   0.00    0.082     13.5
#
# The quarterback found the halfback handoff, collapsed onto it (99% of downs,
# Call/Entropy 0.10 of a possible 1.609), the defense spent four million steps
# learning to stop that one play, and the offense had nothing left to switch to.
#
# It was not a bug in the policy. It was the reward, and there were two faults:
#
#   1. YARD_REWARD_SCALE 0.05 made a hundred-yard drive worth 5.0 against a
#      TOUCHDOWN_REWARD of 1.0. Yardage was worth five times the score it
#      produced, so the optimal policy maximised yards and ignored the end zone.
#      At 7.5M steps the offense's mean reward was +0.702 and its yardage term
#      alone was +0.675 — the terminal rewards had become rounding error.
#      Now 0.01: a full hundred yards is worth exactly one touchdown.
#
#   2. Passing needed a 39% completion rate to break even (0.5 completion, 0.1
#      incompletion, 1.0 interception) and the run threw at 27-44%. Throwing was
#      EV-negative against a handoff that reliably paid its yardage.
#      Now 0.6 / 0.1 / 0.6, which breaks even at 25%.
#
# Neither was reachable from this file. Both are in Systems_SimConstants, and
# Reward_Tests now pins them: ScoringAlwaysOutweighsTheGroundCoveredToReachIt
# checks a hundred-yard drive rather than the six-yard carry the old guard used,
# which is why the old guard passed throughout.
#
# ---------------------------------------------------------------------------
# WHAT CHANGED IN THIS FILE
# ---------------------------------------------------------------------------
#   Quarterback beta      2.0e-2 -> 5.0e-2
#   checkpoint_interval   500000 -> 100000
#   keep_checkpoints      10 -> 20
#
# The beta rise is a hedge, not the fix. beta applies to the whole action
# distribution and the quarterback's includes the continuous aim vector, so it
# cannot be raised far enough to hold four discrete calls open without also
# blurring where the ball is thrown. The precise instrument is a new reward term,
# Reward_Call.Repetition, which prices over-repetition and nothing else: free at
# an even split, -0.37 at the 99% share this run reached.
#
# The checkpoint change is the debugging lesson. base05's collapse happened
# between 2.1M and 3.1M steps and every pre-collapse checkpoint had already been
# pruned by the time anyone looked, so the diverse-playbook policy could not be
# recovered. 100000 with keep_checkpoints 20 keeps a 2M-step window.
#
# ---------------------------------------------------------------------------
# WHAT TO WATCH, IN ORDER
# ---------------------------------------------------------------------------
#   Call/Entropy      the whole point. Below ~0.8 and it is collapsing again.
#                     The trainer's own Policy/Entropy will NOT tell you: through
#                     base05 it rose 3.72 -> 4.04 while the play call went to
#                     0.10, because it sums every action head at once.
#   Call/Pass         0.000 for two runs running. Anything above 0.05 is new.
#   Play/TouchdownRate vs Play/NetYards — scoring should now lead yardage.
#   Environment/Cumulative Reward, offense vs defense, should oppose.
# ---------------------------------------------------------------------------

default_settings: null

behaviors:
  OffenseLine: &football_brain
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480          # 10x batch_size; PPO wants many batches per update
      learning_rate: 3.0e-4
      beta: 5.0e-3                # entropy bonus — keep exploration alive through self-play
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant   # self-play runs long; a linear decay to 0
                                         # freezes the policy while opponents keep improving
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState already emits [-1, 1]; running
                                  # normalization on top fights self-play because the
                                  # input distribution shifts with the opponent.
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    # 500000 was too coarse to debug with. football_base05 collapsed between 2.1M
    # and 3.1M steps and every checkpoint from before the collapse had already
    # been pruned by the time it was noticed, so the diverse-playbook policy was
    # unrecoverable. 100000 with keep_checkpoints 20 covers a 2M-step window.
    checkpoint_interval: 100000
    max_steps: 50000000

    # A play is capped at 750 physics ticks and agents decide every 5th tick
    # (Systems_PlayModel.MAX_DECISIONS = 150), so 150 keeps an entire play inside
    # one horizon and lets credit for a touchdown reach back to the snap — and,
    # now, back to the play call that set it up.
    time_horizon: 150

    summary_freq: 20000
    threaded: false               # deterministic ordering (UNITY_RULES §2)

  OffenseSkill:
    <<: *football_brain

  # The only brain with discrete actions, and the only one whose exploration
  # problem is a DISCRETE one: five play calls of which four were never sampled
  # by the end of base03.
  #
  # It gets four times the entropy bonus of the movement brains. That is safe
  # here in a way it was not when this policy also drove four backs and
  # receivers — beta applies to the whole action distribution, so raising it on
  # the shared brain would have injected noise into five players' steering in
  # order to keep one player's play call exploring. Splitting the brain is what
  # makes this knob usable at all.
  Quarterback:
    <<: *football_brain
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  DefenseLine:
    <<: *football_brain

  DefenseBox:
    <<: *football_brain

  DefenseSecondary:
    <<: *football_brain

env_settings:
  # Set per-run on the command line, not here:
  #   --env=Builds/FootballEnv/PoFootball.exe --no-graphics --base-port=5010 --num-envs=4
  # Envs take CONSECUTIVE ports from --base-port; overlapping ranges hang the
  # handshake with no error (UNITY_RULES §4).
  #
  # Record --num-envs in the run's MANIFEST.md — it changes how experience is
  # batched, so two runs with this file and different --num-envs are not
  # comparable. Tools/promote_brain.py writes it into the manifest for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cuda                    # RTX 2060 present; falls back to cpu if unavailable

checkpoint_settings:
  results_dir: results
