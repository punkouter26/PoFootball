# ARCHIVED 2026-10-16: football_base18's config. The run was stopped at ~2.7M steps
# because a flat 0.15 per flag made fouls pay (flag rate 4% -> 12%); its successor
# is Config/FootballBase19.yaml (football_base19), same contract, fouls priced.
#
# PoFootball -- the first config against CONTRACT_REVISION 16.
#
# Pairs 1:1 with run-id `football_base18` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md):
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase18.yaml --run-id=football_base18 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
#
# REBUILD Builds/FootballEnv FIRST (Tools > PoFootball > Build Training Env).
#
# WHAT REVISION 16 IS. Revision 15 (FootballBase17, archived) read the defense's
# front off a second branch of the Defense brain, from the middle linebacker
# alone. football_base17 called the zero blitz on 37% of plays at 1M steps, 87%
# at 1.3M and 100% by 2M, in every situation: one decision a play riding on a
# brain whose every other sample is steering, at steering's entropy bonus. The
# front is now a FOURTH behavior, DefenseCall -- the defensive coordinator
# (Agent_DefensiveCoordinator): no body, 12 observations (down, distance, yards to
# the goal, a two-point flag, the offense's formation), one branch [9], one
# decision a play once the quarterback's kick window has closed, rewarded with the
# play's defensive terminal reward. The Defense brain is back to [2], the pitch.
#
# WHAT TO READ IN THIS RUN:
#   DefenseCall/<front>     the series base17 collapsed on. It should stay spread
#                           and move with the situation, not settle on one front.
#   Play/TimeExpiredRate    near 0 once anybody tackles (the crowd rule).
#   Call/Entropy, Call/PassDeep, Call/Punt, Call/FieldGoal
#   Kick/PuntNetYards       40 is par.  Play/FlagRate should fall.
#   Play/NetYards counts a kickoff's distance once FullGame starts; it is not game
#   yards per play.
#
# THE TRAINER SETTINGS are FootballBase17's -- time_horizon 124, the 7.5M / 750k
# ten-hour budget, the lessons at 1.5M and 3.4M Offense steps -- plus DefenseCall.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\promote_brain.py --run football_base18 `
#     --version 03 --num-envs 4
#   then Unity: Tools > PoFootball > Build Brain Table, Evaluate Realism (4 fixed
#   seeds), and promote_brain.py --version 03 --check-realism <report>.

behaviors:
  # MA-POCA for the two ten- and eleven-man groups; see archive/FootballBase11.yaml
  # for why, and Systems_BrainGroup for why there are three behaviours, not six.
  Offense: &football_brain
    trainer_type: poca

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 7500000              # the ten-hour window; base15 was still climbing at 7M

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain

  Quarterback:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 750000
    checkpoint_interval: 10000      # the QB steps 10x slower; at 100000 a stop before 100k lost the whole brain
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2                # ten times the movement brains; see Base11
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  # Revision 16: the defensive coordinator. No body, one decision a play (the
  # front), so its own small net and its own exploration bonus -- ten times the
  # movement brains', as the quarterback's is. In football_base17 the front sat on
  # the Defense brain's 5e-3 and collapsed onto the zero blitz by 2M steps.
  DefenseCall:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 14000                # ~one decision a play: about 14k plays in ten hours
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson:
    curriculum:
      - name: RedZone
        completion_criteria:
          measure: progress
          behavior: Offense
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.2
        value: 0.0
      - name: OpenFieldEarlyDowns
        completion_criteria:
          measure: progress
          behavior: Offense
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.45
        value: 1.0
      # Kickoffs and tries are drawn only in this lesson (Systems_RandomSpotProvider).
      - name: FullGame
        value: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
