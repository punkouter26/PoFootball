# PoFootball -- CONTRACT_REVISION 16, fouls priced, block in the back refereed by facing.
#
# Pairs 1:1 with run-id `football_base20` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md):
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase20.yaml --run-id=football_base20 `
#     --initialize-from=football_base19 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
#
# REBUILD Builds/FootballEnv FIRST (Tools > PoFootball > Build Training Env).
#
# WHY A THIRD CONFIG ON REVISION 16. football_base19 (FootballBase19, archived)
# priced every flag at what it gives away in a game, and its flag rate still
# climbed back to 12% of plays by 1.3M steps. It was not a price: replaying its
# checkpoints in the Editor, 35 of 37 flags were ILLEGAL BLOCK IN THE BACK, by
# tight ends and receivers five yards downfield and by linemen in the first
# second. Systems_PenaltySystem judged "from behind" by the victim's VELOCITY, so
# a corner backpedalling in coverage -- moving away from the receiver while
# FACING him -- was hit "in the back" by every stalk block; every new collision of
# the same pair drew again, so one block was rolled a dozen times; and close-line
# play, where a block from behind is legal (NFL Rule 12-1-3), was flagged too. It
# is judged by the body's facing now, once a pair a play, outside the close-line
# zone. The same checkpoints against the fixed rule: 8 flags in 511 plays (1.6%), against 37 in 455 (8.1%, with 30 in 261 on a first sample), and those eight spread over block in the back, facemask, offensive interference and roughing.
#
# A refereeing change that changes only REWARD in training (a flag never stops a
# training play), not shapes or dynamics: still revision 16, and base19's weights
# load. This run starts from them (--initialize-from=football_base19), so the two
# hours base19 trained are kept. Same hyperparameters; the budget is what is left
# of the window (6M / 600k / 12k), and the curriculum starts at the lesson base19
# had reached (OpenFieldEarlyDowns), not at RedZone again.
#
# WHAT TO READ IN THIS RUN:
#   Play/FlagRate           should stay near 4-5% and fall; base18 and base19 reached 12%.
#   DefenseCall/<front>     the series base17 collapsed on. It should stay spread
#                           and move with the situation, not settle on one front.
#   Play/TimeExpiredRate    near 0 once anybody tackles (the crowd rule).
#   Call/Entropy, Call/PassDeep, Call/Punt, Call/FieldGoal
#   Kick/PuntNetYards       40 is par.  Play/FlagRate should fall.
#   Play/NetYards counts a kickoff's distance once FullGame starts; it is not game
#   yards per play.
#
# THE TRAINER SETTINGS are FootballBase17's -- time_horizon 124, the 7.5M / 750k
# ten-hour budget, the lessons at 1.5M and 3.4M Offense steps -- plus DefenseCall.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\promote_brain.py --run football_base19 `
#     --version 03 --num-envs 4
#   then Unity: Tools > PoFootball > Build Brain Table, Evaluate Realism (4 fixed
#   seeds), and promote_brain.py --version 03 --check-realism <report>.

behaviors:
  # MA-POCA for the two ten- and eleven-man groups; see archive/FootballBase11.yaml
  # for why, and Systems_BrainGroup for why there are three behaviours, not six.
  Offense: &football_brain
    trainer_type: poca

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 6000000              # what is left of the ten-hour window after base19's
                                    # 1.63M (~0.8M Offense steps an hour)

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain

  Quarterback:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 600000
    checkpoint_interval: 10000      # the QB steps 10x slower; at 100000 a stop before 100k lost the whole brain
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2                # ten times the movement brains; see Base11
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  # Revision 16: the defensive coordinator. No body, one decision a play (the
  # front), so its own small net and its own exploration bonus -- ten times the
  # movement brains', as the quarterback's is. In football_base17 the front sat on
  # the Defense brain's 5e-3 and collapsed onto the zero blitz by 2M steps.
  DefenseCall:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 12000                # ~one decision a play; base19 made 4.2k in two hours
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson:
    curriculum:
      # No RedZone: football_base19 finished it (1.5M Offense steps) and these
      # weights start from there. FullGame begins ~1.8M steps in (0.3 of 6M),
      # where base19's 3.4M would have put it.
      - name: OpenFieldEarlyDowns
        completion_criteria:
          measure: progress
          behavior: Offense
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.3
        value: 1.0
      # Kickoffs and tries are drawn only in this lesson (Systems_RandomSpotProvider).
      - name: FullGame
        value: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
