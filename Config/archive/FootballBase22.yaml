# PoFootball -- CONTRACT_REVISION 16: fouls priced, block in the back by facing,
# a stall priced as a tackle, a kickoff always kicked, a breakaway is a touchdown.
#
# Pairs 1:1 with run-id `football_base22` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md):
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase22.yaml --run-id=football_base22 `
#     --initialize-from=football_base21 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
#
# REBUILD Builds/FootballEnv FIRST (Tools > PoFootball > Build Training Env).
#
# WHY A FIFTH CONFIG ON REVISION 16. football_base21 (FootballBase21, archived)
# fixed the stall price and the kickoff, and its plays on the 600-tick ceiling
# came back to ~6% once FullGame began. Replayed, its 1.2M checkpoints hit the
# ceiling on 53 plays in 590, and NONE was a stall: every one a carrier 40-62 m
# past the line, running at 4-6 m/s, with nobody within 17-54 m -- a breakaway
# the ceiling (which a played game has too) whistled dead in midfield and priced
# as a tackle, so a breakaway was not worth chasing. At the ceiling the official
# now projects the run (Systems_Referee.IsGoneForTheGoal): if no opponent, at his
# top speed, reaches the carrier's path before the carrier at the pace he is
# actually running, it is a touchdown. The same checkpoints: 15 plays on the ceiling in 617 (was 53 in 590) and 101 touchdowns (was 60) -- the price of a defense that stopped chasing, which this run should teach it to pay less.
#
# A rule at the ceiling only, no shape changed: still revision 16. This run starts
# from football_base21's weights (--initialize-from) in FullGame, which base21 had
# reached, with what is left of the overnight window (3M / 300k / 6k).
#
# WHAT TO READ IN THIS RUN:
#   Play/FlagRate           should stay near 4-5% and fall; base18 and base19 reached 12%.
#   DefenseCall/<front>     the series base17 collapsed on. It should stay spread
#                           and move with the situation, not settle on one front.
#   Play/TimeExpiredRate    near 0 once anybody tackles (the crowd rule).
#   Call/Entropy, Call/PassDeep, Call/Punt, Call/FieldGoal
#   Kick/PuntNetYards       40 is par.  Play/FlagRate should fall.
#   Play/NetYards counts a kickoff's distance once FullGame starts; it is not game
#   yards per play.
#
# THE TRAINER SETTINGS are FootballBase17's -- time_horizon 124, the 7.5M / 750k
# ten-hour budget, the lessons at 1.5M and 3.4M Offense steps -- plus DefenseCall.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\promote_brain.py --run football_base19 `
#     --version 03 --num-envs 4
#   then Unity: Tools > PoFootball > Build Brain Table, Evaluate Realism (4 fixed
#   seeds), and promote_brain.py --version 03 --check-realism <report>.

behaviors:
  # MA-POCA for the two ten- and eleven-man groups; see archive/FootballBase11.yaml
  # for why, and Systems_BrainGroup for why there are three behaviours, not six.
  Offense: &football_brain
    trainer_type: poca

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 3000000              # what is left of the ten-hour window after base19,
                                    # base20 and base21 (~0.8M Offense steps an hour)

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain

  Quarterback:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 300000
    checkpoint_interval: 10000      # the QB steps 10x slower; at 100000 a stop before 100k lost the whole brain
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2                # ten times the movement brains; see Base11
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  # Revision 16: the defensive coordinator. No body, one decision a play (the
  # front), so its own small net and its own exploration bonus -- ten times the
  # movement brains', as the quarterback's is. In football_base17 the front sat on
  # the Defense brain's 5e-3 and collapsed onto the zero blitz by 2M steps.
  DefenseCall:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 6000                 # ~one decision a play; ~1.7k an hour
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  # FullGame only: football_base21 finished OpenFieldEarlyDowns, and these weights
  # start from there. Kickoffs and tries are drawn only in this lesson
  # (Systems_RandomSpotProvider).
  spot_lesson: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
