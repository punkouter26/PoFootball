# PoFootball — milestone 2: quarterback play calls, handoffs and the passing game
#
# Pairs 1:1 with run-id `football_base03` (UNITY_RULES §1).
#   mlagents-learn Config/FootballBase03.yaml --run-id=football_base03
#
# ---------------------------------------------------------------------------
# WHY NOTHING TRANSFERS FROM football_base01 OR base02
# ---------------------------------------------------------------------------
# The observation and action contracts both changed, so no earlier .onnx will
# load. --initialize-from is not an option; this run starts from scratch.
#
#   observations  25 -> 32   (role one-hot 9 -> 10 for the fullback, ball
#                             position/velocity instead of carrier, ball
#                             held/in-flight flags, play-call one-hot)
#   OffenseSkill  2 continuous -> 4 continuous + discrete branches [4, 2]
#   other brains  unchanged at 2 continuous
#
# ---------------------------------------------------------------------------
# WHAT CHANGED IN THE GAME
# ---------------------------------------------------------------------------
# The quarterback now takes every snap and commits to one of four calls on its
# first decision after the snap — keep, hand to the fullback, hand to the
# halfback, or pass. The call is LATCHED: having read the defensive alignment
# the QB cannot change its mind mid-play. Every offensive player observes the
# call; defenders see a zeroed slice, so it is not leaked.
#
# Formation is now an I-form. The third receiver was traded for a fullback to
# keep the offense at eleven.
#
# Passing is fully simulated: the ball leaves the QB's hands, travels, and is
# caught by whoever is closest inside CATCH_RADIUS — either side. A defensive
# catch is an interception and ends the play; an uncaught ball is incomplete.
#
# Two new outcomes exist, so Play/TackleRate no longer sums to ~1 with
# Play/TimeExpiredRate.
#
# ---------------------------------------------------------------------------
# WHAT TO LOOK AT
# ---------------------------------------------------------------------------
#   Play/InterceptionRate   the number to watch. If this runs away, the offense
#                           is throwing into coverage and the pass reward needs
#                           rebalancing against INTERCEPTION_REWARD.
#   Play/IncompletionRate   high early is fine; it should fall as aim improves.
#   Play/TackleRate         the run game still working.
#   Play/TimeExpiredRate    acceptance criterion #23 — target < 0.20.
#   Play/NetYards           should stay in single digits; tens of yards means
#                           the defense has stopped being able to stop anything.
#
# Judge on ELO and the Play/* rates, not mean reward — reward is zero-sum here
# and hovers near 0 however good the policies get (UNITY_RULES §4).

default_settings: null

behaviors:
  OffenseLine: &football_brain
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480          # 10x batch_size; PPO wants many batches per update
      learning_rate: 3.0e-4
      beta: 5.0e-3                # entropy bonus — keep exploration alive through self-play
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant   # self-play runs long; a linear decay to 0
                                         # freezes the policy while opponents keep improving
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState already emits [-1, 1]; running
                                  # normalization on top fights self-play because the
                                  # input distribution shifts with the opponent
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 40
    checkpoint_interval: 500000
    max_steps: 50000000

    # A play is capped at 750 physics ticks and agents decide every 5th tick
    # (Systems_PlayModel.MAX_DECISIONS = 150), so 150 keeps an entire play inside
    # one horizon and lets credit for a touchdown reach back to the snap — and,
    # now, back to the play call that set it up.
    time_horizon: 150

    summary_freq: 20000
    threaded: false               # deterministic ordering (UNITY_RULES §2)

    self_play:
      save_steps: 50000
      team_change: 250000         # 5x save_steps — the documented default ratio
      swap_steps: 25000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

  OffenseSkill:
    <<: *football_brain

  DefenseLine:
    <<: *football_brain

  DefenseCover:
    <<: *football_brain

env_settings:
  # Set per-run on the command line, not here:
  #   --env=Builds/FootballEnv/PoFootball.exe --no-graphics --base-port=5010 --num-envs=4
  # Envs take CONSECUTIVE ports from --base-port; overlapping ranges hang the
  # handshake with no error (UNITY_RULES §4).
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cuda                    # RTX 2060 present; falls back to cpu if unavailable

checkpoint_settings:
  results_dir: results
