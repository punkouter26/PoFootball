# PoFootball -- CONTRACT_REVISION 16: fouls priced, block in the back by facing,
# a stall priced as a tackle, a kickoff always kicked.
#
# Pairs 1:1 with run-id `football_base21` (UNITY_RULES section 1).
#
# Launch (CUDA_VISIBLE_DEVICES=-1 is MANDATORY on this machine -- see CLAUDE.md):
#   $env:CUDA_VISIBLE_DEVICES = "-1"
#   mlagents-learn Config/FootballBase21.yaml --run-id=football_base21 `
#     --initialize-from=football_base20 `
#     --env=Builds/FootballEnv/PoFootball.exe --no-graphics `
#     --base-port=5400 --num-envs=4
#
# REBUILD Builds/FootballEnv FIRST (Tools > PoFootball > Build Training Env).
#
# WHY A FOURTH CONFIG ON REVISION 16. football_base20 (FootballBase20, archived)
# fixed the flags (0.8% of plays) and its plays that hit the 600-tick ceiling
# climbed to 6.8% by 1.2M steps. Replayed in the Editor, its checkpoints showed two
# defects, both fixed here:
#
#   * A STALL WAS PRICED BELOW A TACKLE FOR THE OFFENSE -- a tackle without the
#     first-down bonus, so an offense could not stall past the sticks to collect
#     it -- and the reward is zero-sum, so it was priced ABOVE one for the defense.
#     Defenders shadowed carriers past the line to gain, 13-29 m off them, and
#     never tackled. Reward_Terminal now prices TimeExpired exactly as a tackle on
#     the same spot, the only price neither side can prefer.
#   * A KICKOFF COULD BE PITCHED BEFORE IT WAS KICKED. The kicker laterals to a
#     lineman, the automatic kick waits for the kicker alone, and the kicking
#     team ran the "kickoff" downfield and kept it until the ceiling -- 20-25 of
#     44-56 expired plays in a full game, every one never kicked. A kickoff may
#     not be pitched until it is kicked (Systems_BallSystem.IsKickoffNotYetKicked,
#     in the rule and the mask), and a kicker who reaches the line kicks it there.
#     Replaying base20's 1.3M checkpoints in a full game: 44 expired plays in 609 before, 18 in 607 after the kickoff fix, none of them kickoffs; the rest are the stall, which only retraining against the new price can move.
#
# The first is reward; the second changes kickoffs, which train only in FullGame,
# with no shape changed: still revision 16, and base20's weights load. This run
# starts from them (--initialize-from=football_base20) at the lesson base20 had
# reached, with what is left of the overnight window (4.8M / 480k / 10k).
#
# WHAT TO READ IN THIS RUN:
#   Play/FlagRate           should stay near 4-5% and fall; base18 and base19 reached 12%.
#   DefenseCall/<front>     the series base17 collapsed on. It should stay spread
#                           and move with the situation, not settle on one front.
#   Play/TimeExpiredRate    near 0 once anybody tackles (the crowd rule).
#   Call/Entropy, Call/PassDeep, Call/Punt, Call/FieldGoal
#   Kick/PuntNetYards       40 is par.  Play/FlagRate should fall.
#   Play/NetYards counts a kickoff's distance once FullGame starts; it is not game
#   yards per play.
#
# THE TRAINER SETTINGS are FootballBase17's -- time_horizon 124, the 7.5M / 750k
# ten-hour budget, the lessons at 1.5M and 3.4M Offense steps -- plus DefenseCall.
#
# AFTER IT FINISHES:
#   .venv\Scripts\python.exe Tools\promote_brain.py --run football_base19 `
#     --version 03 --num-envs 4
#   then Unity: Tools > PoFootball > Build Brain Table, Evaluate Realism (4 fixed
#   seeds), and promote_brain.py --version 03 --check-realism <report>.

behaviors:
  # MA-POCA for the two ten- and eleven-man groups; see archive/FootballBase11.yaml
  # for why, and Systems_BrainGroup for why there are three behaviours, not six.
  Offense: &football_brain
    trainer_type: poca

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

    network_settings:
      normalize: false            # Sensor_FootballState emits [-1, 1] already;
                                  # Systems_ContractTests asserts this stays off.
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 20
    checkpoint_interval: 100000
    max_steps: 4800000              # what is left of the ten-hour window after base19's
                                    # 1.63M and base20's 1.4M (~0.8M Offense steps an hour)

    # One whole play: (MAX_PHYSICS_TICKS 600 + PRESNAP_TICKS 20) / DECISION_PERIOD 5.
    # Pinned by Systems_ContractTests.
    time_horizon: 124

    summary_freq: 50000
    threaded: false               # deterministic ordering (UNITY_RULES section 2)

  Defense:
    <<: *football_brain

  Quarterback:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 480000
    checkpoint_interval: 10000      # the QB steps 10x slower; at 100000 a stop before 100k lost the whole brain
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-2                # ten times the movement brains; see Base11
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant

  # Revision 16: the defensive coordinator. No body, one decision a play (the
  # front), so its own small net and its own exploration bonus -- ten times the
  # movement brains', as the quarterback's is. In football_base17 the front sat on
  # the Defense brain's 5e-3 and collapsed onto the zero blitz by 2M steps.
  DefenseCall:
    <<: *football_brain
    trainer_type: ppo
    max_steps: 10000                # ~one decision a play; ~1.7k an hour
    checkpoint_interval: 1000
    summary_freq: 1000
    time_horizon: 8                 # every episode is one step
    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

environment_parameters:
  spot_lesson:
    curriculum:
      # No RedZone: football_base19 finished it (1.5M Offense steps). base20 had
      # ~0.4M of OpenFieldEarlyDowns left; FullGame begins 0.1 of 4.8M in, where
      # the plan put it.
      - name: OpenFieldEarlyDowns
        completion_criteria:
          measure: progress
          behavior: Offense
          signal_smoothing: false
          min_lesson_length: 0
          threshold: 0.1
        value: 1.0
      # Kickoffs and tries are drawn only in this lesson (Systems_RandomSpotProvider).
      - name: FullGame
        value: 2.0

env_settings:
  # --env, --num-envs and --base-port go on the command line (see the header).
  # Record --num-envs in the run's MANIFEST.md; promote_brain.py does it for you.
  seed: 1

engine_settings:
  time_scale: 20                  # physics stays at dt=0.02; this only speeds the clock
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60

torch_settings:
  device: cpu                     # Not sufficient alone: launch with
                                  # CUDA_VISIBLE_DEVICES=-1 (see CLAUDE.md).

checkpoint_settings:
  results_dir: results
